name: Build Real Android App
on:
  push:
    branches:
      - main

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Unzip AI Studio Project
        run: unzip -o mtkmicro-lab.zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies and Build
        run: |
          npm install
          npm run build

      - name: Configure Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          rm -rf android
          npx cap init "MTKmicro Lab" com.mtkmicrolab.app --web-dir dist
          npx cap add android

      - name: Setup Java Environment
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Native APK
        uses: actions/upload-artifact@v4
        with:
          name: MTKmicroLab-Native-App
          path: android/app/build/outputs/apk/debug/*.apk
