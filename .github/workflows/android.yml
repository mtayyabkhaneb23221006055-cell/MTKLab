name: Android APK Build
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip AI Studio Project
        run: unzip mtkmicro-lab.zip

      - name: Build APK
        run: |
          # Find the folder containing the gradlew file dynamically
          GRADLE_DIR=$(dirname $(find . -name "gradlew" | head -n 1))
          cd "$GRADLE_DIR"
          
          # Grant execute permission and build
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/*.apk"
