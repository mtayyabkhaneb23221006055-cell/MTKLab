name: Extract MTKmicro Lab APK
on:
  push:
    branches:
      - main

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Unzip AI Studio Project
        run: unzip -o mtkmicro-lab.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MTKmicroLab-Ready-App
          path: "**/*.apk"
